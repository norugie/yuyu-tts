# Start everything: docker compose up -d --build
# Stop everything:  docker compose down
# Bot logs:         docker compose logs -f bot

# Docker's default log driver never deletes old logs; keep at most 3 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.9.0
    # Local only (for the render script and Kokoro's web UI); the bot uses the Compose network.
    ports: ["127.0.0.1:8880:8880"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # GET /health (confirmed against v0.9.0). Uses Python because the image may not have curl.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8880/health', timeout=3)\" || python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8880/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      # The model takes a while to load on first start.
      start_period: 120s
    restart: unless-stopped
    logging: *logging

  bot:
    build: { context: ., dockerfile: docker/bot.Dockerfile }
    env_file: .env
    environment:
      # Overrides KOKORO_URL from .env: inside Compose, Kokoro is reachable by its service name.
      KOKORO_URL: http://kokoro:8880
    volumes: ["./data:/app/data"]
    depends_on:
      kokoro: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging
    # Hardening: no privilege gain, no Linux capabilities, read-only filesystem.
    # Only data/ (the volume) and /tmp (in memory) can be written.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    # Healthy = the heartbeat file (src/health.ts) was touched in the last 90 s, which only happens
    # while logged in to Discord. Docker Desktop doesn't restart an unhealthy container by itself.
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/yuyu-heartbeat');process.exit(Date.now()-s.mtimeMs<90000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 60s
